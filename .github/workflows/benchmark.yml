name: DataWarehouse Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out benchmark suite
        uses: actions/checkout@v4
        with:
          path: TheSingularityWorkshop.Benchmarks.DataWarehouse

      - name: Check out DataWarehouse
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.DataWarehouse
          ref: f99ded40323fcb18c8a19f5dd3abbc7e7d492644
          path: TheSingularityWorkshop.DataWarehouse

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Capture benchmark provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TheSingularityWorkshop.Benchmarks.DataWarehouse/results/environment
          {
            echo "benchmark_repository=TrentBest/TheSingularityWorkshop.Benchmarks.DataWarehouse"
            echo "benchmark_commit=$(git -C TheSingularityWorkshop.Benchmarks.DataWarehouse rev-parse HEAD)"
            echo "source_repository=TrentBest/TheSingularityWorkshop.DataWarehouse"
            echo "source_commit=$(git -C TheSingularityWorkshop.DataWarehouse rev-parse HEAD)"
            echo "captured_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "runner_os=$(uname -a)"
            echo
            cd TheSingularityWorkshop.Benchmarks.DataWarehouse
            dotnet --info
            echo
            lscpu
            echo
            free -h
          } > TheSingularityWorkshop.Benchmarks.DataWarehouse/results/environment/manifest.txt

      - name: Build benchmark harness
        working-directory: TheSingularityWorkshop.Benchmarks.DataWarehouse
        run: dotnet build TheSingularityWorkshop.Benchmarks.DataWarehouse.csproj -c Release

      - name: Run benchmark suite
        working-directory: TheSingularityWorkshop.Benchmarks.DataWarehouse
        run: |
          mkdir -p BenchmarkDotNet.Artifacts
          dotnet run --project TheSingularityWorkshop.Benchmarks.DataWarehouse.csproj -c Release -- --filter '*' --exporters json markdown 2>&1 | tee BenchmarkDotNet.Artifacts/benchmark-run.log

      - name: Validate measured benchmark execution
        working-directory: TheSingularityWorkshop.Benchmarks.DataWarehouse
        run: |
          set -euo pipefail
          if grep -q "BenchmarkDotNet has failed to build" BenchmarkDotNet.Artifacts/benchmark-run.log; then
            echo "BenchmarkDotNet failed to build one or more generated benchmark projects."
            exit 1
          fi
          if grep -q "executed benchmarks: 0" BenchmarkDotNet.Artifacts/benchmark-run.log; then
            echo "BenchmarkDotNet completed without executing any measurements."
            exit 1
          fi
          report_count=$(find BenchmarkDotNet.Artifacts/results -name '*-report-full-compressed.json' 2>/dev/null | wc -l)
          if [ "$report_count" -eq 0 ]; then
            echo "No full BenchmarkDotNet result reports were produced."
            exit 1
          fi
          echo "Produced $report_count full BenchmarkDotNet result reports."

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datawarehouse-benchmark-results
          path: |
            TheSingularityWorkshop.Benchmarks.DataWarehouse/BenchmarkDotNet.Artifacts/**
            TheSingularityWorkshop.Benchmarks.DataWarehouse/results/environment/**
          if-no-files-found: warn
