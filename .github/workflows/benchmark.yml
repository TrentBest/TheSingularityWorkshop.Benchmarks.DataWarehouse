name: DataWarehouse Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out benchmark suite
        uses: actions/checkout@v4
        with:
          path: TheSingularityWorkshop.Benchmarks.DataWarehouse

      - name: Check out DataWarehouse
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.DataWarehouse
          ref: a019d006dbb2eb4cb525cd3977c9eafaf6eee616
          path: TheSingularityWorkshop.DataWarehouse

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Capture benchmark provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TheSingularityWorkshop.Benchmarks.DataWarehouse/results/environment
          {
            echo "benchmark_repository=TrentBest/TheSingularityWorkshop.Benchmarks.DataWarehouse"
            echo "benchmark_commit=$(git -C TheSingularityWorkshop.Benchmarks.DataWarehouse rev-parse HEAD)"
            echo "source_repository=TrentBest/TheSingularityWorkshop.DataWarehouse"
            echo "source_commit=$(git -C TheSingularityWorkshop.DataWarehouse rev-parse HEAD)"
            echo "captured_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "runner_os=$(uname -a)"
            echo
            dotnet --info
            echo
            lscpu
            echo
            free -h
          } > TheSingularityWorkshop.Benchmarks.DataWarehouse/results/environment/manifest.txt

      - name: Build benchmark harness
        run: dotnet build TheSingularityWorkshop.Benchmarks.DataWarehouse/TheSingularityWorkshop.Benchmarks.DataWarehouse.csproj -c Release

      - name: Run benchmark suite
        run: dotnet run --project TheSingularityWorkshop.Benchmarks.DataWarehouse/TheSingularityWorkshop.Benchmarks.DataWarehouse.csproj -c Release -- --filter '*' --exporters json markdown

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datawarehouse-benchmark-results
          path: |
            TheSingularityWorkshop.Benchmarks.DataWarehouse/BenchmarkDotNet.Artifacts/**
            TheSingularityWorkshop.Benchmarks.DataWarehouse/results/environment/**
          if-no-files-found: warn
